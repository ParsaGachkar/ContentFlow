name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.401'
    - name: Restore
      run: dotnet restore ContentFlow.slnx
    - name: Build
      run: dotnet build ContentFlow.slnx --configuration Release --no-restore
    - name: Test
      run: dotnet test ContentFlow.slnx --configuration Release --no-restore --verbosity minimal

services:
  # One-shot database migration. `docker compose up` runs it to completion
  # before the web app starts (see web.depends_on below); run it explicitly
  # anytime with: docker compose run --rm migrator [apply|status].
  migrator:
    build:
      context: .
      dockerfile: tools/ContentFlow.Migrator/Dockerfile
    environment:
      CONTENTFLOW_ConnectionStrings__ContentFlow: Host=postgres;Port=5432;Database=${POSTGRES_DB:-contentflow};Username=${POSTGRES_USER:-contentflow};Password=${POSTGRES_PASSWORD:-contentflow}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["apply"]
    restart: "no"
  web:
    build:
      context: .
      dockerfile: src/ContentFlow.Blazor/Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__ContentFlow: Host=postgres;Port=5432;Database=${POSTGRES_DB:-contentflow};Username=${POSTGRES_USER:-contentflow};Password=${POSTGRES_PASSWORD:-contentflow}
    ports:
      - "${WEB_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contentflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentflow}
      POSTGRES_DB: ${POSTGRES_DB:-contentflow}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contentflow} -d ${POSTGRES_DB:-contentflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  # Optional services (start with: docker compose --profile optional up -d).
  minio:
    image: minio/minio:latest
    profiles: ["optional"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  imgproxy:
    image: darthsim/imgproxy:latest
    profiles: ["optional"]
    environment:
      IMGPROXY_USE_ETAG: "true"
    ports:
      - "8081:8080"
    depends_on:
      - minio
volumes:
  pg_data:
  minio_data:
